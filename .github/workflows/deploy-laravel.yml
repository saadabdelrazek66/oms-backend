name: Deploy Laravel to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. تجهيز بيئة PHP 8.4 على سيرفرات جيت هاب
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      # 2. بناء ملفات الباك اند وتجهيز فولدر vendor قبل النقل
      - name: Install Composer Dependencies
        run: composer install --optimize-autoloader --no-dev

      - name: Remove unwanted files
        run: rm -rf .git .github tests node_modules

      # 3. نقل كل الملفات (بما فيها vendor الجديد) للسيرفر
      - name: Copy Files to Hostinger via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 65002
          source: "./"
          target: "/home/u578673289/domains/octomedia.digital/public_html/api-management/"

      # 4. تنفيذ أوامر لارفيل فقط (بدون composer) على هوستنجر
      - name: Run Laravel Commands via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 65002
          script: |
            cd /home/u578673289/domains/octomedia.digital/public_html/api-management/
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan migrate --force
